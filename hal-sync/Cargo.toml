uuid = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
hal_settings = { path = "../hal-settings" }
curve25519-dalek = { workspace = true }
hal_crypto = { path = "../hal-crypto" }
hal_cluster = { path = "../hal-cluster" }
